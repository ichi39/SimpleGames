function fitCanvas(){
  const b=document.body,cs=getComputedStyle(b),vv=window.visualViewport;
  const pad=k=>parseFloat(cs[k])||0;
  const aw=(vv?Math.min(vv.width,b.clientWidth):b.clientWidth)-pad('paddingLeft')-pad('paddingRight');
  const ah=(vv?Math.min(vv.height,b.clientHeight):b.clientHeight)-pad('paddingTop')-pad('paddingBottom');
  let w=aw,h=aw*9/16;
  if(h>ah){h=ah;w=ah*16/9}
  cv.style.width=Math.max(1,Math.floor(w))+'px';cv.style.height=Math.max(1,Math.floor(h))+'px';
}

function txt(s,x,y,sz,col,al,o,bold){
  ctx.font=(bold===false?'':'bold ')+sz+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';
  if(o){ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.strokeStyle=o;ctx.strokeText(s,x,y)}

}
function wrap(s,maxW,sz){
  ctx.font='bold '+sz+'px '+FONT;const out=[];
  s.split('\n').forEach(par=>{let line='';for(const ch of par){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch}else line+=ch}out.push(line)});
  return out;
}

function cheeseNaanRows(){
  const rows=[];
  for(let y=0;y<16;y++){
    let r='';
    for(let x=0;x<16;x++){
      const dx=x-7.5,dy=y-7.5,d=Math.sqrt(dx*dx+dy*dy);let c='.';
      if(d<=7.6){
        if(d>7.0)c='k';
        else if(d>5.8)c=(x*3+y*5)%7===0?'z':(x+y)%3===0?'N':'n';
        else if(Math.abs(dx)<.6||Math.abs(dy)<.6)c='W';
        else{const h=(x*5+y*3)%9;c=h===0?'g':h<3?'Y':h===3?'h':'y'}
      }
      r+=c;
    }
    rows.push(r);
  }
  return rows;
}

/* ---------- ペインター: 16x16 を図形で描くと、自動で陰影と輪郭がつく ---------- */
function shadeHex(h,a){
  const n=parseInt(h.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(a>=0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}else{r*=1+a;g*=1+a;b*=1+a}
  return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
}
function paint(fn){
  const g=Array.from({length:16},()=>Array(16).fill(null));
  const P={
    d(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&x<16&&y>=0&&y<16)g[y][x]=c},
    r(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)P.d(x+i,y+j,c)},
    e(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)P.d(x,y,c)}},
    l(x1,y1,x2,y2,c){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;for(let i=0;i<=n;i++)P.d(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,c)},
    p(pts,c){pts.forEach(q=>P.d(q[0],q[1],c))},
    x(x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(x+i>=0&&x+i<16&&y+j>=0&&y+j<16)g[y+j][x+i]=null},
  };
  fn(P);
  const cv=document.createElement('canvas');cv.width=cv.height=16;const c2=cv.getContext('2d');
  const at=(i,j)=>(i>=0&&i<16&&j>=0&&j<16)?g[j][i]:null;
  for(let y=0;y<16;y++)for(let i=0;i<16;i++){
    const col=g[y][i];
    if(col){let k=col;if(!at(i,y-1))k=shadeHex(col,.2);else if(!at(i,y+1))k=shadeHex(col,-.2);c2.fillStyle=k;c2.fillRect(i,y,1,1)}
    else if(at(i-1,y)||at(i+1,y)||at(i,y-1)||at(i,y+1)){c2.fillStyle='#3b2418';c2.fillRect(i,y,1,1)}
  }
  return cv;
}

   Tk=材料をとる / C=調理場で調理 / Tp=トッピング台で仕上げ。choice:true の工程は「ボタンで選ぶ」工程（ベース料理→選んだ料理に変わる）
   label の {S} は、いまのステージでの調理場の名前に置きかわる */
const Tk=l=>({k:'take',label:l});
const C=(st,t,label,o)=>Object.assign({k:'cook',st,t,label},o||{});
const Tp=(t,label,o)=>Object.assign({k:'top',t,label},o||{});
const ITEMS=[],IT={};
function def(id,name,price,cr,sprite,steps,o){
  const it=Object.assign({id,name,price,cr,steps,spr:sprite,course:2},o||{});
  it.sprBurnt=tint(sprite,'#150a05',.72);it.sprGray=tint(sprite,'#000000',.55);
  ITEMS.push(it);IT[id]=it;return it;
}

let AC=null,muted=false,bgmOn=false,bgmStep=0,bgmTimer=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC&&!bgmTimer)startBgm();
}
function tone(f,d,type,v,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
const SFX={
 click:()=>tone(520,.07,'square',.04),
 cook:()=>{tone(300,.08,'square',.04);tone(380,.08,'square',.04,.07)},
 ready:()=>{tone(880,.1,'triangle',.07);tone(1320,.14,'triangle',.07,.08)},
 take:()=>tone(700,.06,'triangle',.06),
 serve:()=>{tone(988,.08,'square',.05);tone(1319,.16,'square',.05,.08)},
 coin:()=>{tone(1568,.07,'square',.04);tone(2093,.18,'square',.04,.07)},
 bad:()=>{tone(180,.18,'sawtooth',.06)},
 burn:()=>{tone(140,.3,'sawtooth',.06)},
 fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.05,i*.12))},
};
const SCALE=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];
function startBgm(){
  let pos=3;
  bgmTimer=setInterval(()=>{
    if(!AC||muted)return;
    bgmStep++;
    const drone=SCALE[0]/2;
    if(bgmStep%8===0)tone(drone,1.4,'triangle',.035);
    if(bgmStep%2===0){
      pos=Math.max(0,Math.min(SCALE.length-1,pos+pick([-2,-1,-1,0,1,1,2])));
      tone(SCALE[pos],.28,'triangle',.03);
    }
  },230);
}

const UP_EFF={

function effText(e){
  const t=[];
  if(e.s)t.push('作業時間 -'+Math.round(e.s*100)+'%');
  if(e.b)t.push('作業台 +1');
  if(e.g)t.push('チップ +'+Math.round(e.g*100)+'%');

function pickOrder(d,forceN){
  const un=curItems(d),r=Math.random(),L=lvl(d);
  if(forceN){const out=[];for(let i=0;i<forceN;i++)out.push(pick(un).id);return out} // 団体: 同じ料理を何個も頼む
  if(fl().course){ // コース: 前菜・メイン・デザートから選ぶ
    const by={1:[],2:[],3:[]};un.forEach(it=>by[it.course].push(it));
    const cs=[1,2,3].filter(c=>by[c].length);
    let n=L<=2?1:L<=5?(r<.5?2:1):(r<.2?1:r<.6?2:3);
    n=Math.min(n,cs.length);
    return cs.slice().sort(()=>Math.random()-.5).slice(0,n).sort((a,b)=>a-b).map(c=>pick(by[c]).id);
  }
  let n=L<=2?1:L<=4?(r<.6?1:2):L<=7?(r<.25?1:r<.75?2:3):(r<.15?1:r<.5?2:3);
  n=Math.min(n,un.length);
  const pool=un.slice(),out=[];
  const todays=STAGES[G.stage-1].menu.filter(m=>m[1]===d).map(m=>m[0]);
  const newest=un.filter(i=>todays.includes(i.id));
  if(newest.length&&Math.random()<.4){const it=pick(newest);out.push(it.id);pool.splice(pool.indexOf(it),1)}
  while(out.length<n){const it=pick(pool);out.push(it.id);pool.splice(pool.indexOf(it),1)}
  return out;
}

/* ---- 調理工程 ----
   料理は dish={id,step} として持ち運ぶ。step は「次にやる工程」の番号。
   ベース料理(base)は、choice の工程で「ボタンで選んだ料理」に変わる。 */
const stepOf=d=>stepsOf(IT[d.id])[d.step];
const dishDone=d=>!IT[d.id].base&&d.step>=stepsOf(IT[d.id]).length;
function stepTime(stp,it){return stp.t*(1-.12*G.up.spd)*(1-ueff(it.id).s)}
function heldNeeds(st){
  const r=[];
  P.hands.forEach((d,i)=>{const s=stepOf(d);if(s&&(st==='top'?s.k==='top':(s.k==='cook'&&s.st===st)))r.push(i)});
  return r;
}
function wasteFor(d){return Math.round(wasteCost(IT[d.id])*(.35+.65*Math.min(1,d.step/stepsOf(IT[d.id]).length))/10)*10}
function loseDish(it,x,label){
  const c=wasteCost(it);P.money-=c;P.waste+=c;float(x,126,label+' -'+yen(c),'#ff7a6a');
}
// トッピング台でやる作業の対象。ボタンを押したとき=そのボタンで選べるベース料理、押さないとき=選ばなくていい料理
function pickable(i,variant){
  const d=P.hands[i],it=IT[d.id],stp=stepOf(d);
  return stp.choice?(!!variant&&it.base&&it.opts.includes(variant)):!variant;
}
function topCandidate(variant){return heldNeeds('top').find(i=>pickable(i,variant))}
// 変数 undefined を -1 にそろえる
const topIdx=v=>{const i=topCandidate(v);return i===undefined?-1:i};

/* ---- 調理場の予約処理 ----
   調理場をタップした予約は「その場で待って、できあがりを取り出し、次を置く」まで面倒を見る。
   1) 置ける料理があって、空き枠があれば置く
   2) 枠が全部使用中なら、できあがりを待つ → できあがったら自動で取り出して、次を置く
   3) 置く料理がなければ、調理中の料理のできあがりを待って取り出す */
function heatPlan(st,variant){
  const slots=P.st[st];
  const used=slots.map((s,k)=>({s,k})).filter(o=>o.s.dish);
  const doneOf=list=>list.find(o=>o.s.state==='ready'||o.s.state==='burnt');
  const canTake=o=>o.s.state==='burnt'||P.hands.length<handsMax();
  const needs=heldNeeds(st);
  const cand=needs.filter(i=>pickable(i,variant));
  if(cand.length){
    const k=slots.findIndex(s=>!s.dish);
    if(k>=0)return{kind:'place',i:cand[0],k,variant};
    const done=doneOf(used);
    if(done)return canTake(done)?{kind:'collect',k:done.k,then:true}:{kind:'blocked'};
    return used.length?{kind:'wait'}:{kind:'none'};
  }
  if(variant)return{kind:'nomatch'};
  if(needs.length)return{kind:'choose'};
  const done=doneOf(used);
  if(done)return canTake(done)?{kind:'collect',k:done.k}:{kind:'blocked'};
  return used.length?{kind:'wait'}:{kind:'none'};
}
function placeDish(st,i,k,variant){
  const d=P.hands[i];P.hands.splice(i,1);
  if(variant&&IT[d.id].base)d.id=variant; // ボタンで選んだ料理に決まる
  const stp=stepOf(d);
  Object.assign(P.st[st][k],{dish:d,state:'cook',p:0,rt:0,left:stp.batch||1});
  SFX.cook();P.cooks[st]=(P.cooks[st]||0)+1;
}
// まとめ調理(batch)は、手に持てるだけ続けて取り出す
function collectSlot(st,k){
  const sl=P.st[st][k];
  if(sl.state==='burnt'){sl.dish=null;sl.state='idle';sl.left=0;say('こげちゃった…すてました');SFX.bad();return}
  const d=sl.dish;
  while(sl.dish&&P.hands.length<handsMax()){
    P.hands.push({id:d.id,step:d.step+1});sl.left--;
    if(sl.left<=0){sl.dish=null;sl.state='idle';sl.left=0}
  }
  SFX.take();
}

/* ---- 予約キュー: タップした順に主人公が動く ---- */
function enqueue(a){
  if(P.q.length>=QMAX){say('よやくがいっぱい！');SFX.bad();return}
  if(a.t==='take'&&P.q.some(b=>b.t==='take'&&b.st===a.st&&b.k===a.k))return;

function actX(a){return a.t==='serve'?a.c.x:a.t==='trash'?STX.trash:(a.t==='start'||a.t==='restock')?STX.pantry:STX[a.st]}
function actValid(a){
  if(a.t==='take'){const sl=P.st[a.st][a.k];return !!(sl&&sl.dish)}

}
function actDur(a){
  if(a.t==='step'&&a.st==='top'){
    const i=topIdx(a.variant);
    if(i>=0){const d=P.hands[i],id=(IT[d.id].base&&a.variant)?a.variant:d.id;return Math.max(.15,stepTime(stepsOf(IT[id])[d.step],IT[id]))}

  }

const MSG_PLAN={none:'ここでできる作業がないよ',blocked:'手がいっぱい！ 先に届けるか、ゴミ箱へ',choose:'どの料理にするか、ボタンで選んでね',nomatch:'そのボタンで作れる料理を持っていないよ'};
function perform(a){
  const b=P.boy;
  if(a.t==='start'){
    if(P.hands.length>=handsMax()){say('手がいっぱい！ 先に届けるか、ゴミ箱へ');SFX.bad();return}
    if(fl().stock){if((P.stock[a.item]||0)<=0){say('ざいこ切れ！「＋」で補充しよう');SFX.bad();return}P.stock[a.item]--}
    P.hands.push({id:a.item,step:1});SFX.take();
  }else if(a.t==='restock'){
    P.stock[a.item]=Math.min(10,(P.stock[a.item]||0)+5);SFX.coin();float(b.x,126,'＋補充','#9affb0');
  }else if(a.t==='step'&&a.st==='top'){
    const i=topIdx(a.variant);
    if(i<0){say(a.variant?'そのトッピングで作れる料理がないよ':heldNeeds('top').length?'のせるものを、ボタンで選んでね':'ここでできる作業がないよ');SFX.bad();return}
    const d=P.hands[i];if(a.variant&&IT[d.id].base)d.id=a.variant;
    d.step++;SFX.ready();sparkle(b.x,125,5);
  }else if(a.t==='step'){
    execHeat(a,heatPlan(a.st,a.variant));
  }else if(a.t==='take'){
    const sl=P.st[a.st][a.k];if(!sl||!sl.dish)return;
    if(sl.state!=='burnt'&&P.hands.length>=handsMax()){say('手がいっぱい！ 先に届けるか、ゴミ箱へ');SFX.bad();return}
    collectSlot(a.st,a.k);
  }else if(a.t==='trash'){
    if(!P.hands.length)return;
    let loss=0;P.hands.forEach(d=>{loss+=wasteFor(d)});
    P.money-=loss;P.waste+=loss;P.hands=[];
    float(b.x,126,'すてた -'+yen(loss),'#ff7a6a');SFX.bad();
  }else if(a.t==='serve')serveCust(a.c);
}
// 調理場の予約を1回ぶん実行（テストからも使う）。予約を終えたら true
function execHeat(a,plan){
  if(plan.kind==='place'){placeDish(a.st,plan.i,plan.k,plan.variant);return true}
  if(plan.kind==='collect'){collectSlot(a.st,plan.k);return !plan.then}
  say(MSG_PLAN[plan.kind]||'');SFX.bad();return true;
}
function updateBoy(dt){
  const b=P.boy,q=P.q;
  while(q.length&&!actValid(q[0]))q.shift();
  if(!q.length){b.state='idle';b.act=0;b.pg=0;return}
  const a=q[0],tx=actX(a),dx=tx-b.x;
  if(Math.abs(dx)>1){
    const sp=150*(1+.2*(G.up.walk||0));
    b.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);b.state='walk';b.act=0;b.pg=0;return;
  }
  b.x=tx;
  if(a.t==='take'&&P.st[a.st][a.k].state==='cook'){b.state='wait';b.pg=0;return} // できあがるまで待つ
  let plan=null;
  if(a.t==='step'&&a.st!=='top'){
    plan=heatPlan(a.st,a.variant);
    if(plan.kind==='wait'){b.state='wait';b.act=0;b.pg=0;return} // 枠が空く・できあがるまで、その場で待つ
    if(!['place','collect'].includes(plan.kind)){q.shift();b.act=0;b.pg=0;execHeat(a,plan);return}
  }
  b.state='act';b.act+=dt;
  const dur=actDur(a);b.pg=Math.min(1,b.act/dur);
  if(b.act<dur)return;
  b.act=0;b.pg=0;
  if(plan){if(execHeat(a,plan))q.shift()}
  else{q.shift();perform(a)}
}
function serveCust(c){
  if(!c||c.state!=='wait')return;
  let n=0,blocked=false;
  const frac=Math.max(0,c.pat/c.max); // チップは渡す前の機嫌で決まる
  const course=!!fl().course;
  c.need.forEach(nd=>{
    if(nd.done)return;
    // コース: 前のコースが出ていないうちは、次のコースは出せない
    if(course&&c.need.some(o=>!o.done&&o.course<nd.course)){if(P.hands.some(d=>d.id===nd.id&&dishDone(d)))blocked=true;return}
    const k=P.hands.findIndex(d=>d.id===nd.id&&dishDone(d));
    if(k>=0){
      P.hands.splice(k,1);nd.done=true;n++;sparkle(c.x,80,6);
      c.pat=Math.min(c.max,c.pat+c.max*.12); // 料理をもらうと機嫌が少し回復
    }
  });
  if(n&&!c.need.every(nd=>nd.done))float(c.x,60,'♥ きげんUP','#ff9fd0');
  if(!n){c.shake=.3;say(blocked?'コースの順番に出そう！ 前菜→メイン→デザート':'ほしいのは「できあがり」のふきだしの料理だよ！');SFX.bad();return}
  SFX.serve();
  if(c.need.every(nd=>nd.done)){
    const base=c.need.reduce((s,nd)=>s+iprice(IT[nd.id]),0)*(c.group?1.25:1);
    // チップは、機嫌(frac)と、料理ごとの「評判アップ」で増える
    const tipBase=c.need.reduce((s,nd)=>s+iprice(IT[nd.id])*(.5+ueff(nd.id).g),0)*(c.group?1.25:1);
    const tip=Math.round(tipBase*frac*(1+.1*G.up.decor)/10)*10;
    P.combo++;P.maxCombo=Math.max(P.maxCombo,P.combo);
    const mult=1+Math.min(P.combo-1,8)*.05;
    const gain=Math.round((base+tip)*mult/10)*10;
    P.money+=gain;P.tips+=tip;P.served++;P.dish+=base;
    c.need.forEach(nd=>{P.mat+=Math.round(iprice(IT[nd.id])*IT[nd.id].cr)});
    float(c.x,60,'+'+yen(gain),'#ffe066');
    if(c.group)float(c.x,48,'団体さま ×1.25','#ffd84a');
    if(tip>0)float(c.x,72,'チップ '+yen(tip),'#9affb0');
    if(P.combo>=2)float(c.x,84,'COMBO ×'+P.combo,'#ff9fd0');
    SFX.coin();sparkle(c.x,80,14,'#ffe066');
    dismiss(c,'happy');
  }
}
function updatePlay(dt){
  if(P.paused)return;
  P.floats.forEach(f=>f.t+=dt);P.floats=P.floats.filter(f=>f.t<1.2);
  P.parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt});P.parts=P.parts.filter(p=>p.t<p.life);
  if(P.msgT>0)P.msgT-=dt;
  P.leaving.forEach(c=>c.lt-=dt);P.leaving=P.leaving.filter(c=>c.lt>0);
  if(P.count>0){P.count-=dt;return}
  if(P.banner>0)P.banner-=dt;
  // 営業時間。閉店後は新しいお客さんが来ないが、いまいるお客さんは対応できる
  if(!P.closed){P.t-=dt;if(P.t<=0){P.t=0;P.closed=true;P.banner=2.4;SFX.fanfare()}}
  // 調理場
  HEAT.forEach(sid=>P.st[sid].forEach(s=>{
    if(!s.dish)return;
    const it=IT[s.dish.id],stp=stepOf(s.dish);
    if(s.state==='cook'){s.p+=dt;if(s.p>=stepTime(stp,it)){s.state='ready';s.rt=0;SFX.ready()}}
    else if(s.state==='ready'&&burnable(sid)&&!stp.batch){s.rt+=dt;if(s.rt>8){s.state='burnt';SFX.burn();P.burned++;loseDish(it,STX[sid],'こげた！')}}
  }));
  updateBoy(dt);
  // お客さん
  if(!P.closed){
    P.spawn-=dt;
    if(P.spawn<=0){if(spawnCust())P.spawn=P.conf.interval*rnd(.7,1.3);else P.spawn=.8}
  }
  P.slots.slice().forEach(c=>{
    if(!c)return;
    if(c.shake>0)c.shake-=dt;
    if(c.state==='enter'||c.state==='wait'){
      const dx=c.tx-c.x;
      if(Math.abs(dx)>.5)c.x+=Math.sign(dx)*Math.min(Math.abs(dx),170*dt);
      else{c.x=c.tx;if(c.state==='enter')c.state='wait'}
    }
    if(c.state==='wait'){
      c.pat-=dt;
      if(c.pat<=0){P.lost++;P.combo=0;dismiss(c,'angry');say('お客さんが帰っちゃった…');SFX.bad()}
    }
  });
  // 閉店後、お客さんが全員いなくなったら一日おしまい
  if(P.closed&&!P.slots.some(Boolean)&&!P.leaving.length){P.over+=dt;if(P.over>1.8)showResult()}
}

/* ===== リザルト（帳簿つき） ===== */
// 帳簿。家賃・人件費・光熱費は「店ごとの実額」の固定費で、売上が少ない日は赤字になり、貯金から引かれる。
// 貯金が尽きると借金になる（借金中は機械のアップグレードができない）。
function calcLedger(){
  const f=finOf(),c=P.cooks,wage=1100;
  const labor=Math.round(f.hours*wage/10)*10,rent=f.rent;
  const gas=f.gas+((c.h1||0)+(c.h2||0)+(c.h3||0))*6;
  const misc=f.misc+P.served*18;
  const gross=P.money+P.waste;
  const L={
    dish:P.dish,tips:P.tips,bonus:Math.max(0,gross-P.dish-P.tips),waste:P.waste,sales:P.money,
    mat:P.mat,labor,hours:f.hours,wage,rent,monthly:f.monthly,elec:f.elec,gas,water:f.water,util:f.elec+gas+f.water,misc
  };
  L.exp=L.mat+L.labor+L.rent+L.util+L.misc;
  L.net=L.sales-L.exp;
  return L;
}
// 1日あたりの固定費（家賃・人件費・光熱費・雑費）
function fixedDaily(){const f=finOf();return Math.round(f.rent+f.hours*1100+f.elec+f.gas+f.water+f.misc)}
let RS=null;
function showResult(){
  const win=P.money>=P.goal,stars=P.money>=P.goal*1.8?3:P.money>=P.goal*1.4?2:win?1:0;
  RS={win,stars,money:P.money,goal:P.goal,served:P.served,lost:P.lost,combo:P.maxCombo,day:P.day,t:0,L:calcLedger(),stageClear:false,stage:G.stage};
  if(win){
    G.cash=G.cash+RS.L.net;G.day=P.day+1;
    if(P.day>=stg().days){G.stageClear=true;RS.stageClear=true;RS.prize=finOf().prize;G.cash+=RS.prize}
    saveGame();SFX.fanfare();
  }else SFX.bad();
  scene='result';
}

    rows.forEach((r,i)=>{

};

/* ===== ショップ ===== */
function toShop(){scene='shop'}
let shopTab=0,shopSel=null;
// そのステージで営業を終えた日数。強化はこれが増えるほど少しずつ解放される
const daysDone=()=>Math.max(0,Math.min(G.day-1,stg().days));
const upgradable=()=>menuAt(G.stage,daysDone());
const menuDay=id=>STAGES[G.stage-1].menu.find(m=>m[0]===id)[1];
const ITEM_UP_NEED=[0,2,4]; // 料理が解禁されてから、Lv1/Lv2/Lv3 が買えるまでの日数
function goNext(){
  if(G.stageClear){
    const last=G.stage>=STAGES.length;
    startStory(STAGE_END[G.stage],()=>{
      if(last){G.cleared=true;saveGame();scene='ending';SFX.fanfare();return}
      G.stage++;G.day=1;G.stageClear=false;G.up.decor=0;saveGame();
      startStory(STAGE_PRO[G.stage].concat(dayPages(1)),startPlay);
    });
  }else if(G.stage===1&&G.day===1&&!G.intro)startStory(PROLOGUE.concat(dayPages(1)),()=>{G.intro=true;saveGame();startPlay()});
  else startStory(dayPages(G.day),startPlay);
}
SC.shop={
  draw(){
    R(0,0,W,H,'#3a2438');for(let x=0;x<W;x+=24)R(x,0,12,H,'#40283e');
    txt('お店をととのえる  〜 '+stg().name+' 〜',20,6,13,'#ffe066','left','#3b2418');
    txt((G.cash<0?'借金 ':'貯金 ')+yen(Math.abs(G.cash)),460,8,12,G.cash<0?'#ff8a7a':'#fff','right','#3b2418');
    button(14,26,92,14,'お店',()=>{shopTab=0},{sz:8,col:shopTab===0?'#e8742a':'#5a3a6a'});
    button(110,26,92,14,'メニュー',()=>{shopTab=1},{sz:8,col:shopTab===1?'#e8742a':'#5a3a6a'});
    const fd=fixedDaily();
    txt(G.cash<0?'借金中は強化できません。稼いで返そう！':'毎日の固定費 約'+yen(fd)+'（家賃など） → 貯金で約'+Math.floor(G.cash/fd)+'日分',212,30,8,G.cash<0?'#ff8a7a':'#d8c8e0','left',null,false);
    if(shopTab===0){
      UPS.forEach((u,i)=>{
        const y=46+i*31,lv=G.up[u.id]||0,max=u.cost.length;
        box(14,y,452,29,'#5e4a63','#1e1214');
        txt(u.name,24,y+3,9,'#fff');txt(u.desc,24,y+16,8,'#d8c8e0','left',null,false);
        for(let k=0;k<max;k++)R(330+k*12,y+10,9,9,k<lv?'#ffd84a':'#2a1a2e');
        if(lv>=max)button(386,y+4,70,21,'MAX',()=>{},{disabled:true,sz:9});
        else{const c=u.cost[lv],lock=daysDone()<u.need[lv];button(386,y+4,70,21,lock?'あと'+(u.need[lv]-daysDone())+'日':yen(c),()=>{G.cash-=c;G.up[u.id]=lv+1;saveGame();SFX.coin()},{disabled:lock||G.cash<c,sz:9,col:'#3a8a5a'})}
      });
    }else{
      const list=upgradable();
      if(!list.find(i=>i.id===shopSel))shopSel=list[0]?list[0].id:null;
      list.forEach((it,i)=>{
        const bx=14+(i%4)*34,by=46+Math.floor(i/4)*40,lv=ilv(it.id),sel=it.id===shopSel;
        box(bx,by,32,38,sel?'#e8742a':'#5e4a63','#1e1214');
        spr(it.spr,bx+4,by+2,1.5);
        for(let k=0;k<3;k++)R(bx+5+k*8,by+30,6,5,k<lv?'#ffd84a':'#2a1a2e');
        hit(bx,by,32,38,()=>{shopSel=it.id;SFX.click()});
      });
      txt(list.length?'料理を選んで\n機械をアップグレード':'営業を始めると\n強化できる料理が増えるよ',14,170,8,'#d8c8e0','left',null,false);
      if(shopSel){
        const it=IT[shopSel],lv=ilv(it.id),kind=upKind(it);
        box(156,44,310,194,'#4a3652','#1e1214');
        spr(it.spr,160,46,1.5);
        txt(it.name,190,48,10,'#ffe066','left','#1e1214');
        txt(stepsOf(it).map(lab).join(' → '),190,62,7,'#d8c8e0','left',null,false);
        [0,1,2].map(i=>upText(it,i)).forEach((u,i)=>{
          const y=76+i*54,e=UP_EFF[kind][i],done=lv>i,next=lv===i;
          box(160,y,302,50,done?'#3a5a44':'#5e4a63','#1e1214');
          txt('Lv'+(i+1),166,y+4,8,done?'#9affb0':'#ffd84a');
          txt(u[0],190,y+4,9,'#fff');
          wrap(u[1],205,7).slice(0,2).forEach((l,k)=>txt(l,166,y+17+k*9,7,'#d8c8e0','left',null,false));
          txt(effText(e),166,y+37,7,'#ffe066','left',null,true);
          const c=itemUpCost(it,i);
          if(done)button(398,y+14,58,22,'導入済み',()=>{},{disabled:true,sz:7,col:'#3a8a5a'});
          else if(next){const wait=ITEM_UP_NEED[i]-(daysDone()-menuDay(it.id));const lock=wait>0;button(398,y+14,58,22,lock?'あと'+wait+'日':yen(c),()=>{G.cash-=c;G.itemUp[it.id]=lv+1;saveGame();SFX.coin()},{disabled:lock||G.cash<c,sz:8,col:'#3a8a5a'})}
          else button(398,y+14,58,22,'まだ',()=>{},{disabled:true,sz:8});
        });
      }
    }
    const last=G.stage>=STAGES.length;
    let msg;
    if(G.stageClear)msg=last?'ついに世界料理王決定戦の結果が…！':'つぎは新しいお店「'+STAGES[G.stage].name+'」！';
    else msg='つぎは DAY '+G.day+'   目標 '+yen(calcGoal(G.day));
    txt(msg,20,246,10,'#fff','left','#3b2418');
    button(340,240,130,24,G.stageClear?(last?'エンディングへ':'新しいお店へ'):'つぎの日へ',goNext,{sz:10});
    drawMute();
  }
};

/* ===== メインループ ===== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
  hits.length=0;
  const sc=SC[scene];
  if(sc.update)sc.update(dt);
  sc.draw();
  if(scene==='title'||scene==='story')drawMute();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
