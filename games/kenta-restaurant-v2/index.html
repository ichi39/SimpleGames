function fitCanvas(){
  const b=document.body,cs=getComputedStyle(b),vv=window.visualViewport;
  const pad=k=>parseFloat(cs[k])||0;
  const aw=(vv?Math.min(vv.width,b.clientWidth):b.clientWidth)-pad('paddingLeft')-pad('paddingRight');
  const ah=(vv?Math.min(vv.height,b.clientHeight):b.clientHeight)-pad('paddingTop')-pad('paddingBottom');
  let w=aw,h=aw*9/16;
  if(h>ah){h=ah;w=ah*16/9}
  cv.style.width=Math.max(1,Math.floor(w))+'px';cv.style.height=Math.max(1,Math.floor(h))+'px';
}

function txt(s,x,y,sz,col,al,o,bold){

  if(o){ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.strokeStyle=o;ctx.strokeText(s,x,y)}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);

  ctx.font='bold '+sz+'px '+FONT;const out=[];
  s.split('\n').forEach(par=>{let line='';for(const ch of par){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch}else line+=ch}out.push(line)});
  return out;
}

function mk(name,rows,over){
  const p=Object.assign({},PAL,over||{});
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  rows.forEach((r,y)=>{if(r.length!==w)console.warn('sprite',name,'row',y,'len',r.length,'expected',w)});
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!=='.'&&p[ch]){g.fillStyle=p[ch];g.fillRect(x,y,1,1)}}});
  return c;
}
function tint(src,col,a){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');
  g.drawImage(src,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=a;g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c;
}

function cheeseNaanRows(){
  const rows=[];

    for(let x=0;x<16;x++){
      const dx=x-7.5,dy=y-7.5,d=Math.sqrt(dx*dx+dy*dy);let c='.';

        else{const h=(x*5+y*3)%9;c=h===0?'g':h<3?'Y':h===3?'h':'y'}
      }
      r+=c;
    }
    rows.push(r);
  }
  return rows;
}

function pizzaRows(heavy){
  const rows=[];
  for(let y=0;y<16;y++){
    let r='';
    for(let x=0;x<16;x++){
      const dx=x-7.5,dy=y-7.5,d=Math.sqrt(dx*dx+dy*dy);let c='.';
      if(d<=7.7){
        if(d>7.0)c='k';
        else if(d>5.7)c=(x+y)%4===0?'N':'n';
        else{const h=Math.abs(((x+(heavy?3:0))*73856093)^((y+(heavy?7:0))*19349663))%10;c=heavy?(h<2?'W':h<4?'r':h<5?'g':'y'):(h<3?'r':h<4?'g':h<7?'W':'y')}
      }
      r+=c;
    }
    rows.push(r);
  }
  return rows;
}

/* ---------- メニュー定義（工程つき） ---------- */
// spec: 'take|h1:5|top:.7'  take=材料をとる / hN:秒=調理場で調理 / top:秒=トッピング台で作業
const ITEMS=[],IT={};
function RC(spec){return spec.split('|').map(p=>{const q=p.split(':');return q[0]==='take'?{k:'take'}:q[0]==='top'?{k:'top',t:+q[1]||.6}:{k:'cook',st:q[0],t:+q[1]}})}
function def(stage,day,id,name,price,cr,rows,pal,spec,labels){
  const it={id,name,price,cr,stage,day,steps:RC(spec),labels,rows};
  it.steps.forEach((s,i)=>{s.label=labels[i]||''});
  it.spr=mk(id,rows,pal);it.sprBurnt=tint(it.spr,'#150a05',.72);it.sprGray=tint(it.spr,'#000000',.55);
  ITEMS.push(it);IT[id]=it;
}

let AC=null,muted=false,bgmOn=false,bgmStep=0,bgmTimer=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC&&!bgmTimer)startBgm();
}
function tone(f,d,type,v,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}

 fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.05,i*.12))},
};
const SCALE=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];
function startBgm(){
  let pos=3;
  bgmTimer=setInterval(()=>{
    if(!AC||muted)return;
    bgmStep++;
    const drone=SCALE[0]/2;
    if(bgmStep%8===0)tone(drone,1.4,'triangle',.035);
    if(bgmStep%2===0){
      pos=Math.max(0,Math.min(SCALE.length-1,pos+pick([-2,-1,-1,0,1,1,2])));
      tone(SCALE[pos],.28,'triangle',.03);
    }
  },230);
}

function calcGoal(d){
  const c=dayConf(d),un=curItems(d);
  const avg=un.reduce((s,i)=>s+i.price,0)/un.length;
  const L=lvl(d),k=Math.min(un.length,L<=2?1:L<=4?1.4:L<=7?2:2.3);
  return Math.max(500,Math.round(c.dur/c.interval*avg*k*.34/100)*100);
}

  P={day:G.day,conf:c,t:c.dur,money:0,goal:calcGoal(G.day),slots:[null,null,null,null],leaving:[],st:{},hands:[],q:[],
     boy:{x:240,state:'idle',act:0,pg:0},
     spawn:.6,combo:0,maxCombo:0,served:0,lost:0,tips:0,floats:[],parts:[],msg:'',msgT:0,over:0,count:2.2,paused:false,burned:0,
     waste:0,closed:false,banner:0,dish:0,mat:0,cooks:{}};
  // 調理場の作業台は料理ごと。購入した分だけ、その料理の専用台が並ぶ
  HEAT.forEach(h=>P.st[h]=[]);
  curItems(G.day).forEach(it=>{
    const cs=it.steps.find(x=>x.k==='cook');
    if(cs)for(let b=0;b<benchOf(it.id);b++)P.st[cs.st].push({item:it.id,dish:null,state:'idle',p:0,rt:0});
  });
  scene='play';
}
function say(m){P.msg=m;P.msgT=2.4}
function float(x,y,s,col){P.floats.push({x,y,s,col:col||'#ffe066',t:0})}
function sparkle(x,y,n,col){for(let i=0;i<n;i++)P.parts.push({x,y,vx:rnd(-50,50),vy:rnd(-80,-20),t:0,life:rnd(.4,.8),col:col||'#ffe066'})}
function pickOrder(d){
  const un=curItems(d),r=Math.random(),L=lvl(d);
  let n=L<=2?1:L<=4?(r<.6?1:2):L<=7?(r<.25?1:r<.75?2:3):(r<.15?1:r<.5?2:3);
  n=Math.min(n,un.length);
  const pool=un.slice(),out=[];
  const newest=un.filter(i=>i.day===d);
  if(newest.length&&Math.random()<.4){const it=pick(newest);out.push(it.id);pool.splice(pool.indexOf(it),1)}
  while(out.length<n){const it=pick(pool);out.push(it.id);pool.splice(pool.indexOf(it),1)}
  return out;
}
function spawnCust(){
  const i=P.slots.findIndex(c=>!c);
  if(i<0)return false;
  const need=pickOrder(P.day);
  const pat=(34+need.length*8)*(1+.15*G.up.pat);
  P.slots[i]={spr:pick(CUSTS),x:W+40,tx:SLOT_X[i],need:need.map(id=>({id,done:false})),pat,max:pat,state:'enter',bob:rnd(0,6),shake:0};
  return true;
}
// 客が帰ったら、残りの客は先頭から詰めて並び直す
function compact(){
  const a=P.slots.filter(Boolean);
  P.slots=a.concat(Array(4-a.length).fill(null));
  a.forEach((c,i)=>c.tx=SLOT_X[i]);
}
function dismiss(c,mood){
  const i=P.slots.indexOf(c);if(i<0)return;
  c.state='leave';c.mood=mood;c.lt=.9;P.leaving.push(c);P.slots[i]=null;compact();
}

/* ---- 調理工程 ----
   料理は dish={id,step} として持ち運ぶ。step は「次にやる工程」の番号。
   take(材料をとる) → cook(調理場に置く→できあがるまで待つ→取り出す) / top(トッピング台で仕上げ) の順。 */
const stepOf=d=>stepsOf(IT[d.id])[d.step];
const dishDone=d=>d.step>=stepsOf(IT[d.id]).length;
function stepTime(stp,it){return stp.t*(1-.12*G.up.spd)*(1-ueff(it.id).s)}
function freeSlot(st,id){return P.st[st].findIndex(s=>s.item===id&&!s.dish)}
function heldNeed(st){
  return P.hands.findIndex(d=>{const s=stepOf(d);return s&&(st==='top'?s.k==='top':(s.k==='cook'&&s.st===st))});
}
function heldNeeds(st){
  const r=[];
  P.hands.forEach((d,i)=>{const s=stepOf(d);if(s&&(st==='top'?s.k==='top':(s.k==='cook'&&s.st===st)))r.push(i)});
  return r;
}
function heatPlan(st){
  const slots=P.st[st].map((s,k)=>({s,k})).filter(o=>o.s.dish);
  const doneOf=list=>list.find(o=>o.s.state==='ready'||o.s.state==='burnt');
  const canTake=o=>o.s.state==='burnt'||P.hands.length<handsMax();
  const needs=heldNeeds(st);
  if(needs.length){
    for(const i of needs){const k=freeSlot(st,P.hands[i].id);if(k>=0)return{kind:'place',i,k}}
    // 置きたい料理の台が全部使用中。できあがりを待って取り出し、その台に置く
    const busy=slots.filter(o=>o.s.item===P.hands[needs[0]].id);
    const done=doneOf(busy);
    if(done)return canTake(done)?{kind:'collect',k:done.k,then:true}:{kind:'blocked'};
    return busy.length?{kind:'wait'}:{kind:'none'};
  }
  const done=doneOf(slots);
  if(done)return canTake(done)?{kind:'collect',k:done.k}:{kind:'blocked'};
  return slots.length?{kind:'wait'}:{kind:'none'};
}
function placeDish(st,i,k){
  const d=P.hands[i];P.hands.splice(i,1);
  Object.assign(P.st[st][k],{dish:d,state:'cook',p:0,rt:0});
  SFX.cook();P.cooks[st]=(P.cooks[st]||0)+1;
}
function collectSlot(st,k){
  const sl=P.st[st][k];
  if(sl.state==='burnt'){sl.dish=null;sl.state='idle';say('こげちゃった…すてました');SFX.bad();return}
  sl.dish.step++;P.hands.push(sl.dish);sl.dish=null;sl.state='idle';SFX.take();
}
function wasteFor(d){return Math.round(wasteCost(IT[d.id])*(.35+.65*Math.min(1,d.step/stepsOf(IT[d.id]).length))/10)*10}
function loseDish(it,x,label){
  const c=wasteCost(it);P.money-=c;P.waste+=c;float(x,126,label+' -'+yen(c),'#ff7a6a');
}

/* ---- 予約キュー: タップした順に主人公が動く ---- */
function enqueue(a){
  if(P.q.length>=QMAX){say('よやくがいっぱい！');SFX.bad();return}
  if(a.t==='take'&&P.q.some(b=>b.t==='take'&&b.st===a.st&&b.k===a.k))return;
  if(a.t==='trash'&&P.q.some(b=>b.t==='trash'))return;
  P.q.push(a);SFX.click();
}
function actX(a){return a.t==='serve'?a.c.x:a.t==='trash'?STX.trash:a.t==='start'?STX.pantry:STX[a.st]}
function actValid(a){
  if(a.t==='take'){const sl=P.st[a.st][a.k];return !!(sl&&sl.dish)}
  if(a.t==='trash')return P.hands.length>0;
  if(a.t==='serve')return a.c.state==='wait'&&P.slots.includes(a.c);
  return true;
}
function actDur(a){
  if(a.t==='step'&&a.st==='top'){const i=heldNeed('top');return i>=0?Math.max(.15,stepTime(stepOf(P.hands[i]),IT[P.hands[i].id])):.15}
  return .25;
}
function perform(a){
  const b=P.boy;
  if(a.t==='start'){
    if(P.hands.length>=handsMax()){say('手がいっぱい！ 先に届けるか、ゴミ箱へ');SFX.bad();return}
    P.hands.push({id:a.item,step:1});SFX.take();
  }else if(a.t==='step'){
    const i=heldNeed(a.st);
    if(i<0){say('ここでできる作業がないよ');SFX.bad();return}
    const d=P.hands[i];
    if(a.st==='top'){d.step++;SFX.ready();sparkle(b.x,125,5);return}
    const k=freeSlot(a.st,d.id);
    if(k<0){say('この料理の作業台がいっぱい！');SFX.bad();return}
    P.hands.splice(i,1);Object.assign(P.st[a.st][k],{dish:d,state:'cook',p:0,rt:0});
    SFX.cook();P.cooks[a.st]=(P.cooks[a.st]||0)+1;
  }else if(a.t==='take'){
    const arr=P.st[a.st],s=arr[a.k];if(!s||!s.dish)return;
    if(s.state==='burnt'){s.dish=null;s.state='idle';say('こげちゃった…すてました');SFX.bad();return}
    if(P.hands.length>=handsMax()){say('手がいっぱい！ 先に届けるか、ゴミ箱へ');SFX.bad();return}
    s.dish.step++;P.hands.push(s.dish);s.dish=null;s.state='idle';SFX.take();
  }else if(a.t==='trash'){
    if(!P.hands.length)return;
    let loss=0;P.hands.forEach(d=>{loss+=wasteFor(d)});
    P.money-=loss;P.waste+=loss;P.hands=[];
    float(b.x,126,'すてた -'+yen(loss),'#ff7a6a');SFX.bad();
  }else if(a.t==='serve')serveCust(a.c);
}
function updateBoy(dt){
  const b=P.boy,q=P.q;
  while(q.length&&!actValid(q[0]))q.shift();
  if(!q.length){b.state='idle';b.act=0;b.pg=0;return}
  const a=q[0],tx=actX(a),dx=tx-b.x;
  if(Math.abs(dx)>1){
    const sp=150*(1+.2*(G.up.walk||0));
    b.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);b.state='walk';b.act=0;b.pg=0;return;
  }
  b.x=tx;
  if(a.t==='take'&&P.st[a.st][a.k].state==='cook'){b.state='wait';b.pg=0;return} // できあがるまで待つ
  let plan=null;
  if(a.t==='step'&&a.st!=='top'){
    plan=heatPlan(a.st);
    if(plan.kind==='wait'){b.state='wait';b.act=0;b.pg=0;return} // 台が空く・できあがるまで、その場で待つ
    if(plan.kind==='none'||plan.kind==='blocked'){
      q.shift();b.act=0;b.pg=0;
      say(plan.kind==='blocked'?'手がいっぱい！ 先に届けるか、ゴミ箱へ':'ここでできる作業がないよ');SFX.bad();return;
    }
  }
  b.state='act';b.act+=dt;
  const dur=actDur(a);b.pg=Math.min(1,b.act/dur);
  if(b.act<dur)return;
  b.act=0;b.pg=0;
  if(plan){
    if(plan.kind==='place'){placeDish(a.st,plan.i,plan.k);q.shift()}
    else{collectSlot(a.st,plan.k);if(!plan.then)q.shift()} // 置くために取り出したときは、予約は続ける
  }else{q.shift();perform(a)}
}
function serveCust(c){
  if(!c||c.state!=='wait')return;
  let n=0;
  const frac=Math.max(0,c.pat/c.max); // チップは渡す前の機嫌で決まる
  c.need.forEach(nd=>{
    if(nd.done)return;
    const k=P.hands.findIndex(d=>d.id===nd.id&&dishDone(d));
    if(k>=0){
      P.hands.splice(k,1);nd.done=true;n++;sparkle(c.x,80,6);
      c.pat=Math.min(c.max,c.pat+c.max*.12); // 料理をもらうと機嫌が少し回復
    }
  });
  if(n&&!c.need.every(nd=>nd.done))float(c.x,60,'♥ きげんUP','#ff9fd0');
  if(!n){c.shake=.3;say('ほしいのは「できあがり」のふきだしの料理だよ！');SFX.bad();return}
  SFX.serve();
  if(c.need.every(nd=>nd.done)){
    const base=c.need.reduce((s,nd)=>s+iprice(IT[nd.id]),0);
    const tip=Math.round(base*.5*frac*(1+.1*G.up.decor)/10)*10;
    P.combo++;P.maxCombo=Math.max(P.maxCombo,P.combo);
    const mult=1+Math.min(P.combo-1,8)*.05;
    const gain=Math.round((base+tip)*mult/10)*10;
    P.money+=gain;P.tips+=tip;P.served++;P.dish+=base;
    c.need.forEach(nd=>{P.mat+=Math.round(iprice(IT[nd.id])*IT[nd.id].cr)});
    float(c.x,60,'+'+yen(gain),'#ffe066');
    if(tip>0)float(c.x,72,'チップ '+yen(tip),'#9affb0');
    if(P.combo>=2)float(c.x,84,'COMBO ×'+P.combo,'#ff9fd0');
    SFX.coin();sparkle(c.x,80,14,'#ffe066');
    dismiss(c,'happy');
  }
}
function updatePlay(dt){
  if(P.paused)return;
  P.floats.forEach(f=>f.t+=dt);P.floats=P.floats.filter(f=>f.t<1.2);
  P.parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt});P.parts=P.parts.filter(p=>p.t<p.life);
  if(P.msgT>0)P.msgT-=dt;
  P.leaving.forEach(c=>c.lt-=dt);P.leaving=P.leaving.filter(c=>c.lt>0);
  if(P.count>0){P.count-=dt;return}
  if(P.banner>0)P.banner-=dt;
  // 営業時間。閉店後は新しいお客さんが来ないが、いまいるお客さんは対応できる
  if(!P.closed){P.t-=dt;if(P.t<=0){P.t=0;P.closed=true;P.banner=2.4;SFX.fanfare()}}
  // 調理場
  HEAT.forEach(sid=>P.st[sid].forEach(s=>{
    if(!s.dish)return;
    const it=IT[s.dish.id],stp=stepOf(s.dish);
    if(s.state==='cook'){s.p+=dt;if(s.p>=stepTime(stp,it)){s.state='ready';s.rt=0;SFX.ready()}}
    else if(s.state==='ready'&&burnable(sid)){s.rt+=dt;if(s.rt>8){s.state='burnt';SFX.burn();P.burned++;loseDish(it,STX[sid],'こげた！')}}
  }));
  updateBoy(dt);
  // お客さん
  if(!P.closed){
    P.spawn-=dt;
    if(P.spawn<=0){if(spawnCust())P.spawn=P.conf.interval*rnd(.7,1.3);else P.spawn=.8}
  }
  P.slots.slice().forEach(c=>{
    if(!c)return;
    if(c.shake>0)c.shake-=dt;
    if(c.state==='enter'||c.state==='wait'){
      const dx=c.tx-c.x;
      if(Math.abs(dx)>.5)c.x+=Math.sign(dx)*Math.min(Math.abs(dx),170*dt);
      else{c.x=c.tx;if(c.state==='enter')c.state='wait'}
    }
    if(c.state==='wait'){
      c.pat-=dt;
      if(c.pat<=0){P.lost++;P.combo=0;dismiss(c,'angry');say('お客さんが帰っちゃった…');SFX.bad()}
    }
  });
  // 閉店後、お客さんが全員いなくなったら一日おしまい
  if(P.closed&&!P.slots.some(Boolean)&&!P.leaving.length){P.over+=dt;if(P.over>1.8)showResult()}
}
// 工程の進み具合に応じて、料理のドット絵を下から少しずつ完成させて見せる
function drawDish(d,x,y,size,extra){
  const it=IT[d.id],f=Math.min(1,(d.step+(extra||0))/stepsOf(it).length),sc=size/16;
  ctx.globalAlpha=.4;spr(it.sprGray,x,y,sc);ctx.globalAlpha=1;
  if(f>=1){spr(it.spr,x,y,sc);return}
  const h=Math.max(1,Math.round(16*f));
  ctx.drawImage(it.spr,0,16-h,16,h,Math.round(x),Math.round(y+(16-h)*sc),16*sc,h*sc);
}
function drawBubble(c){
  const n=c.need.length,w=n*27+5,x=Math.round(c.x-w/2),y=20;
  R(x+1,y+3,w,30,'#00000033');
  box(x,y,w,30,'#fff','#3b2418');
  R(Math.round(c.x)-3,y+30,6,2,'#fff');R(Math.round(c.x)-2,y+32,4,2,'#fff');
  R(Math.round(c.x)-3,y+30,1,3,'#3b2418');R(Math.round(c.x)+2,y+30,1,3,'#3b2418');R(Math.round(c.x)-2,y+33,4,1,'#3b2418');
  c.need.forEach((nd,i)=>{
    const ix=x+4+i*27,it=IT[nd.id];
    if(nd.done){ctx.globalAlpha=.3;spr(it.spr,ix,y+3,1.5);ctx.globalAlpha=1;txt('✓',ix+12,y+4,16,'#2fa04a','center','#fff')}
    else spr(it.spr,ix,y+3,1.5);
  });
}

function drawCust(c,i){
  const wait=c.state==='wait';
  const moving=Math.abs(c.tx-c.x)>1;
  const bob=!moving&&wait?Math.round(Math.sin(T*4+c.bob)):Math.round(Math.sin(T*14)*1.5);
  const x=c.x+(c.shake>0?Math.sin(T*60)*2:0);
  let y=64+bob,a=1;
  if(c.state==='leave'){a=Math.max(0,c.lt/.9);y-=Math.round((1-a)*10)}
  ctx.globalAlpha=a;spr(c.spr,x-24,y,3);ctx.globalAlpha=1;
  if(wait){
    drawBubble(c);
    const f=Math.max(0,c.pat/c.max);
    R(Math.round(x)-20,57,40,4,'#2a1a1e');R(Math.round(x)-19,58,Math.round(38*f),2,f>.5?'#6fd36a':f>.25?'#ffd84a':'#ff5a4a');
    if(f<.3&&Math.floor(T*4)%2)txt('!',Math.round(x)+18,y-4,12,'#ff3a2a','center','#fff');
  }else if(c.state==='enter'){/* 歩き中 */}
  else if(c.state==='leave'){
    if(c.mood==='happy'){spr(HEART,x-3.5,y-8-(1-a)*14,1,a);spr(HEART,x+10,y-2-(1-a)*10,1,a)}
    else txt('！！',x,y-8,10,'#ff3a2a','center','#fff');
  }
}
function decor(level){
  if(level>=1){for(let x=0;x<W;x+=12){R(x,14,1,3,'#7a5a3a');const col=['#d9392b','#f2c14e','#3aa06a','#4aa3df'][(x/12)%4];R(x+1,16,8,2,col);R(x+2,18,6,2,col);R(x+3,20,4,2,col)}}
  if(level>=2){[[70],[458]].forEach(([x])=>{R(x,22,1,10,'#7a5a3a');R(x-4,32,9,12,'#d9392b');R(x-3,33,7,2,'#ffd84a');R(x-4,44,9,2,'#8e1f1f')})}
  if(level>=3){R(0,88,W,16,'#d98a3a');for(let x=0;x<W;x+=12){R(x+4,92,4,4,'#f2c14e')}}
  if(level>=4){R(0,14,W,1,'#ffd84a');R(0,102,W,2,'#ffd84a')}
}
function drawTrash(x,y){
  ctx.fillStyle='#00000033';ctx.beginPath();ctx.ellipse(x,y+27,13,3,0,0,7);ctx.fill();
  box(x-11,y+5,22,22,'#9aa5b0','#3b2418');
  for(let i=0;i<3;i++)R(x-6+i*6,y+9,2,14,'#7a8590');
  box(x-13,y+1,26,5,'#b6c0ca','#3b2418');R(x-4,y-2,8,3,'#59606a');
}
function hintText(){
  if(P.msgT>0)return P.msg;
  if(P.closed)return '閉店！ のこりのお客さんに届けよう';
  // 持っている料理の「つぎの工程」を教える
  if(P.hands.length){
    return P.hands.slice(0,2).map(d=>{const it=IT[d.id];return it.name+'→'+(dishDone(d)?'できあがり！客へ':stepOf(d).label)}).join('\n');
  }
  if(G.stage===1&&P.day<=2){
    if(Object.values(P.st).some(a=>a.some(s=>s&&s.state==='ready')))return 'できた料理をタップで取り出す！';
    return 'ふきだしの料理を材料棚でタップ！';
  }
  return '';
}
function badge(x,y,list){

  box(Math.round(x),Math.round(y),w,10,'#ffd84a','#3b2418');txt(s,Math.round(x)+w/2,Math.round(y)+1,7,'#3b2418','center');
}

SC.play={
  update(dt){updatePlay(dt)},
  draw(){
    const live=!P.paused&&P.count<=0;
    const lhit=(x,y,w,h,fn)=>{if(live)hit(x,y,w,h,fn)};

/* ===== リザルト（帳簿つき） ===== */
// 帳簿。家賃・人件費・光熱費は「店ごとの実額」の固定費で、売上が少ない日は赤字になり、貯金から引かれる。
// 貯金が尽きると借金になる（借金中は機械のアップグレードができない）。
function calcLedger(){
  const f=stg().fin,c=P.cooks,wage=1100;
  const labor=Math.round(f.hours*wage/10)*10,rent=Math.round(f.rent/30/10)*10;
  const gas=f.gas+((c.h1||0)+(c.h2||0)+(c.h3||0))*6;
  const misc=f.misc+P.served*18;
  const gross=P.money+P.waste;
  const L={
    dish:P.dish,tips:P.tips,bonus:Math.max(0,gross-P.dish-P.tips),waste:P.waste,sales:P.money,
    mat:P.mat,labor,hours:f.hours,wage,rent,monthly:f.rent,elec:f.elec,gas,water:f.water,util:f.elec+gas+f.water,misc
  };
  L.exp=L.mat+L.labor+L.rent+L.util+L.misc;
  L.net=L.sales-L.exp;
  return L;
}
// 1日あたりの固定費（家賃・人件費・光熱費・雑費）
function fixedDaily(){const f=stg().fin;return Math.round(f.rent/30+f.hours*1100+f.elec+f.gas+f.water+f.misc)}

}

const upgradable=()=>ITEMS.filter(it=>it.stage===G.stage&&it.day<=daysDone());
const ITEM_UP_NEED=[0,2,4]; // 料理が解禁されてから、Lv1/Lv2/Lv3 が買えるまでの日数
function goNext(){
  if(G.stageClear){
    const last=G.stage>=STAGES.length;
    startStory(STAGE_END[G.stage],()=>{
      if(last){G.cleared=true;saveGame();scene='ending';SFX.fanfare();return}
      G.stage++;G.day=1;G.stageClear=false;G.up.decor=0;saveGame();
      startStory(STAGE_PRO[G.stage].concat(dayPages(1)),startPlay);
    });
  }else if(G.stage===1&&G.day===1&&!G.intro)startStory(PROLOGUE.concat(dayPages(1)),()=>{G.intro=true;saveGame();startPlay()});
  else startStory(dayPages(G.day),startPlay);
}
SC.shop={
  draw(){
    R(0,0,W,H,'#3a2438');for(let x=0;x<W;x+=24)R(x,0,12,H,'#40283e');
    txt('お店をととのえる  〜 '+stg().name+' 〜',20,6,13,'#ffe066','left','#3b2418');
    txt((G.cash<0?'借金 ':'貯金 ')+yen(Math.abs(G.cash)),460,8,12,G.cash<0?'#ff8a7a':'#fff','right','#3b2418');
    button(14,26,92,14,'お店',()=>{shopTab=0},{sz:8,col:shopTab===0?'#e8742a':'#5a3a6a'});
    button(110,26,92,14,'メニュー',()=>{shopTab=1},{sz:8,col:shopTab===1?'#e8742a':'#5a3a6a'});
    const fd=fixedDaily();
    txt(G.cash<0?'借金中は強化できません。稼いで返そう！':'毎日の固定費 約'+yen(fd)+'（家賃など） → 貯金で約'+Math.floor(G.cash/fd)+'日分',212,30,8,G.cash<0?'#ff8a7a':'#d8c8e0','left',null,false);
    if(shopTab===0){
      UPS.forEach((u,i)=>{
        const y=46+i*31,lv=G.up[u.id]||0,max=u.cost.length;
        box(14,y,452,29,'#5e4a63','#1e1214');
        txt(u.name,24,y+3,9,'#fff');txt(u.desc,24,y+16,8,'#d8c8e0','left',null,false);
        for(let k=0;k<max;k++)R(330+k*12,y+10,9,9,k<lv?'#ffd84a':'#2a1a2e');
        if(lv>=max)button(386,y+4,70,21,'MAX',()=>{},{disabled:true,sz:9});
        else{const c=u.cost[lv],lock=daysDone()<u.need[lv];button(386,y+4,70,21,lock?'あと'+(u.need[lv]-daysDone())+'日':yen(c),()=>{G.cash-=c;G.up[u.id]=lv+1;saveGame();SFX.coin()},{disabled:lock||G.cash<c,sz:9,col:'#3a8a5a'})}
      });
    }else{
      const list=upgradable();
      if(!list.find(i=>i.id===shopSel))shopSel=list[0]?list[0].id:null;
      list.forEach((it,i)=>{
        const bx=14+(i%4)*34,by=46+Math.floor(i/4)*40,lv=ilv(it.id),sel=it.id===shopSel;
        box(bx,by,32,38,sel?'#e8742a':'#5e4a63','#1e1214');
        spr(it.spr,bx+4,by+2,1.5);
        for(let k=0;k<3;k++)R(bx+5+k*8,by+30,6,5,k<lv?'#ffd84a':'#2a1a2e');
        hit(bx,by,32,38,()=>{shopSel=it.id;SFX.click()});
      });
      txt(list.length?'料理を選んで\n機械をアップグレード':'営業を始めると\n強化できる料理が増えるよ',14,170,8,'#d8c8e0','left',null,false);
      if(shopSel){
        const it=IT[shopSel],lv=ilv(it.id),kind=upKind(it);
        box(156,44,310,194,'#4a3652','#1e1214');
        spr(it.spr,160,46,1.5);
        txt(it.name,190,48,10,'#ffe066','left','#1e1214');
        txt(stepsOf(it).map(x=>x.label).join(' → '),190,62,7,'#d8c8e0','left',null,false);
        UP_TXT[it.id].forEach((u,i)=>{
          const y=76+i*54,e=UP_EFF[kind][i],done=lv>i,next=lv===i;
          box(160,y,302,50,done?'#3a5a44':'#5e4a63','#1e1214');
          txt('Lv'+(i+1),166,y+4,8,done?'#9affb0':'#ffd84a');
          txt(u[0],190,y+4,9,'#fff');
          wrap(u[1],205,7).slice(0,2).forEach((l,k)=>txt(l,166,y+17+k*9,7,'#d8c8e0','left',null,false));
          txt(effText(e),166,y+37,7,'#ffe066','left',null,true);
          const c=itemUpCost(it,i);
          if(done)button(398,y+14,58,22,'導入済み',()=>{},{disabled:true,sz:7,col:'#3a8a5a'});
          else if(next){const wait=ITEM_UP_NEED[i]-(daysDone()-it.day);const lock=wait>0;button(398,y+14,58,22,lock?'あと'+wait+'日':yen(c),()=>{G.cash-=c;G.itemUp[it.id]=lv+1;saveGame();SFX.coin()},{disabled:lock||G.cash<c,sz:8,col:'#3a8a5a'})}
          else button(398,y+14,58,22,'まだ',()=>{},{disabled:true,sz:8});
        });
      }
    }
    const last=G.stage>=STAGES.length;
    let msg;
    if(G.stageClear)msg=last?'ついに世界料理王決定戦の結果が…！':'つぎは新しいお店「'+STAGES[G.stage].name+'」！';
    else msg='つぎは DAY '+G.day+'   目標 '+yen(calcGoal(G.day));
    txt(msg,20,246,10,'#fff','left','#3b2418');
    button(340,240,130,24,G.stageClear?(last?'エンディングへ':'新しいお店へ'):'つぎの日へ',goNext,{sz:10});
    drawMute();
  }
};

/* ===== エンディング ===== */
SC.ending={
  draw(){
    drawBG('win');
    for(let i=0;i<50;i++){const x=(i*73)%W,y=(T*40+i*31)%H;R(x,y,3,3,['#d9392b','#f2c14e','#4aa3df','#3aa06a','#ff9fd0'][i%5])}
    box(40,14,400,60,'#8a4b25','#3b2418');box(44,18,392,52,'#b8662f','#3b2418');
    txt('世界一の料理人！',240,22,20,'#fff3d0','center','#5a2a12');
    txt('ケンタのレストラン物語  おしまい',240,50,10,'#ffe066','center','#5a2a12');
    ITEMS.forEach((it,i)=>{const b=Math.round(Math.abs(Math.sin(T*3+i*.5))*4);spr(it.spr,6+(i%14)*33,92-b+Math.floor(i/14)*30,1.5)});
    drawChar('boy',150,226,5,{joy:true,talk:true});drawChar('dad',330,226,5,{ok:true});
    txt('プレイしてくれて ありがとう！',240,160,10,'#3b2418','center','#fff');
    button(100,238,120,24,'タイトルへ',()=>{scene='title'},{sz:10});
    button(260,238,120,24,'ゲーム一覧へ',goList,{sz:10,col:'#6a5a7a'});
    drawMute();
  }
};

/* ===== メインループ ===== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
  hits.length=0;
  const sc=SC[scene];
  if(sc.update)sc.update(dt);
  sc.draw();
  if(scene==='title'||scene==='story')drawMute();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
